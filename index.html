        const STORAGE_KEY_USERS = 'koperasi_users_v5';
        const STORAGE_KEY_LOANS = 'koperasi_loans_v5';
        const STORAGE_KEY_SAVINGS = 'koperasi_savings_v5';

        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw7ShMvhht8Pfr93T0S7vEoYamWhv1PtBeXrBsm4xzHwI0K66l98sW3uXp8KVNtv8bGFA/exec';

        async function fetchLoansAndSavingsFromGoogleSheets(nip) {
            try {
                const responseLoans = await fetch(`${GOOGLE_APPS_SCRIPT_URL}?action=getLoans&nip=${nip}`);
                if (responseLoans.ok) {
                    const sheetLoans = await responseLoans.json();
                    if (Array.isArray(sheetLoans) && sheetLoans.length > 0) {
                        let localLoans = getLoans();
                        sheetLoans.forEach(sLoan => {
                            const idx = localLoans.findIndex(l => l.id === sLoan.id || (l.nip === nip && l.pinjamanKe === sLoan.pinjamanKe));
                            if (idx !== -1) {
                                if (sLoan.sisaPinjaman !== undefined) localLoans[idx].sisaPinjaman = parseFloat(sLoan.sisaPinjaman);
                                if (sLoan.jumlahPinjaman !== undefined) localLoans[idx].jumlahPinjaman = parseFloat(sLoan.jumlahPinjaman);
                                if (sLoan.tglDisetujui !== undefined) localLoans[idx].tglDisetujui = sLoan.tglDisetujui;
                                if (sLoan.status !== undefined) localLoans[idx].status = sLoan.status;
                            } else {
                                localLoans.push(sLoan);
                            }
                        });
                        saveLoans(localLoans);
                    }
                }

                const responseSavings = await fetch(`${GOOGLE_APPS_SCRIPT_URL}?action=getSavings&nip=${nip}`);
                if (responseSavings.ok) {
                    const sheetSavings = await responseSavings.json();
                    if (Array.isArray(sheetSavings) && sheetSavings.length > 0) {
                        let localSavings = getSavings();
                        sheetSavings.forEach(sSav => {
                            const idx = localSavings.findIndex(s => s.id === sSav.id || (s.nip === nip && s.jenis === sSav.jenis));
                            if (idx !== -1) {
                                if (sSav.jumlah !== undefined) localSavings[idx].jumlah = parseFloat(sSav.jumlah);
                                if (sSav.status !== undefined) localSavings[idx].status = sSav.status;
                            } else {
                                localSavings.push(sSav);
                            }
                        });
                        saveSavings(localSavings);
                    }
                }
            } catch (err) {
                console.log("Menggunakan data lokal.");
            }
        }

        function getSavings() { return JSON.parse(localStorage.getItem(STORAGE_KEY_SAVINGS) || '[]'); }
        function saveSavings(s) { localStorage.setItem(STORAGE_KEY_SAVINGS, JSON.stringify(s)); }
        function getPayments() { return JSON.parse(localStorage.getItem(STORAGE_KEY_PAYMENTS) || '[]'); }
        function savePayments(p) { localStorage.setItem(STORAGE_KEY_PAYMENTS, JSON.stringify(p)); }

        function clearSession() { localStorage.removeItem(STORAGE_KEY_SESSION); }

        function calculateUserSavings(nip) {
            const savings = getSavings().filter(s => s.nip === nip && s.status === 'Disetujui');
            const totalPokok = savings.filter(s => s.jenis === 'Pokok').reduce((acc, curr) => acc + (parseFloat(curr.jumlah) || 0), 0);
            const totalWajib = savings.filter(s => s.jenis === 'Wajib').reduce((acc, curr) => acc + (parseFloat(curr.jumlah) || 0), 0);
            const totalSukarela = savings.filter(s => s.jenis === 'Sukarela').reduce((acc, curr) => acc + (parseFloat(curr.jumlah) || 0), 0);
            return {
                pokok: totalPokok,
                wajib: totalWajib,
                sukarela: totalSukarela,
                total: totalPokok + totalWajib + totalSukarela
            };
        }

        async function syncToGoogleSheets(payload) {
            try {
                await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Gagal sinkronisasi ke Google Sheets:", err);
            }
        }

        function showNotification(message, type = 'success', callback = null) {
            const existing = document.getElementById('custom-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'custom-modal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn';
            const iconClass = type === 'success' ? 'fa-circle-check text-emerald-500' : 'fa-circle-exclamation text-rose-500';

            modal.innerHTML = `
                <div class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center border border-white/40">
                    <div class="w-16 h-16 mx-auto mb-4 flex items-center justify-center rounded-full bg-slate-100 text-3xl">
                        <i class="fa-solid ${iconClass}"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-2">${type === 'success' ? 'Berhasil!' : 'Perhatian!'}</h3>
                    <p class="text-xs text-slate-600 mb-6 leading-relaxed">${message}</p>
                    <button id="modal-ok-btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-200 transition">OK</button>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('modal-ok-btn').onclick = () => { modal.remove(); if (callback) callback(); };
        }

        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function downloadStatusReportPDF(nip) {

                filename:     `Rincian_Sisa_Pinjaman_KPN_UNRAM_${nip}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },

                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            showNotification('Mengunduh Laporan Sisa Pinjaman PDF...', 'success');
            html2pdf().set(opt).from(element).save();

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value;
            const users = getUsers();
            const foundUser = users.find(u => u.nip === id && u.password === pass);

            if (foundUser) {
                if (foundUser.nip === 'admin') {
                    foundUser.isAdmin = true;
                    foundUser.isApproved = true;
                }
                if (!foundUser.isApproved) {
                    showNotification('Akun Anda masih menunggu persetujuan dari Administrator KPN UNRAM. Mohon tunggu hingga akun disetujui.', 'error');
                    return;
                }
                setSession(foundUser);
                showNotification(`Selamat datang kembali, ${foundUser.nama}!`, 'success', render);
            } else {
                showNotification('NIP atau Password salah!', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const pass = document.getElementById('reg-pass').value;
            const passConfirm = document.getElementById('reg-pass-confirm').value;
            if (pass !== passConfirm) {
                showNotification('Password dan Konfirmasi Password tidak sama!', 'error');
                return;
            }
            const nip = document.getElementById('reg-nip').value.trim();
            const users = getUsers();
            if (users.some(u => u.nip === nip)) {
                showNotification('NIP tersebut sudah terdaftar!', 'error');
                return;
            }
            const fotoInput = document.getElementById('reg-foto').files[0];
            if (fotoInput) {
                const reader = new FileReader();
                reader.onload = function(ev) { processRegistration(ev.target.result, pass); };
                reader.readAsDataURL(fotoInput);
            } else {
                processRegistration('https://placehold.co/150x150/e2e8f0/64748b?text=Foto', pass);
            }
        }

        function processRegistration(fotoBase64, pass) {
            const newUser = {
                role: document.getElementById('reg-role').value,
                nip: document.getElementById('reg-nip').value.trim(),
                password: pass,
                nama: document.getElementById('reg-nama').value.trim(),
                tempatLahir: document.getElementById('reg-tempat-lahir').value.trim(),
                tglLahir: document.getElementById('reg-tgl-lahir').value,
                telp: document.getElementById('reg-telp').value.trim(),
                alamat: document.getElementById('reg-alamat').value.trim(),
                golongan: document.getElementById('reg-golongan').value.trim(),
                unitKerja: document.getElementById('reg-unit').value,
                foto: fotoBase64,
                createdAt: new Date().toISOString(),
                isAdmin: false,
                isApproved: false
            };
            const users = getUsers();
            users.push(newUser);
            saveUsers(users);

            syncToGoogleSheets({
                action: "saveUser",
                ...newUser
            });

            showNotification('Pendaftaran akun berhasil! Akun Anda sedang menunggu persetujuan dari Administrator sebelum dapat digunakan untuk masuk ke sistem.', 'success', () => { authMode = 'login'; render(); });
        }

        function calculateTotalSisaPinjaman() {
            let totalSisa = 0;
            for (let i = 1; i <= 6; i++) {
                const sisaVal = parseFloat(document.getElementById(`multi-sisa-${i}`)?.value) || 0;
                const jumlahVal = parseFloat(document.getElementById(`multi-jumlah-${i}`)?.value) || 0;
                totalSisa += sisaVal > 0 ? sisaVal : jumlahVal;
            }

            const displayEl = document.getElementById('total-sisa-pinjaman-display');
            if (displayEl) {
                displayEl.innerText = `Rp ${totalSisa.toLocaleString('id-ID')}`;
            }

            const reqTag = document.getElementById('jaminan-required-tag');
            const jaminanInput = document.getElementById('loan-jaminan');

            if (totalSisa >= 30000000) {
                if (reqTag) {
                    reqTag.innerHTML = `<span class="text-rose-600 font-bold animate-pulse">* (WAJIB UPLOAD karena Total Sisa Pinjaman >= Rp 30.000.000)</span>`;
                }
                if (jaminanInput) {
                    jaminanInput.required = true;
                }
            } else {
                if (reqTag) {
                    reqTag.innerHTML = `<span class="text-slate-400 font-normal">(Opsional / Wajib Jika Total >= Rp 30 Juta)</span>`;
                }
                if (jaminanInput) {
                    jaminanInput.required = false;
                }
            }

            return totalSisa;
        }

        function handleMultiLoanSubmit(e, nip) {
            e.preventDefault();
            const blangkoFile = document.getElementById('loan-blangko').files[0];
            const jaminanFile = document.getElementById('loan-jaminan').files[0];

            let submittedLoans = [];
            let totalSisaAcc = 0;

            for (let i = 1; i <= 6; i++) {
                const jumlah = parseFloat(document.getElementById(`multi-jumlah-${i}`).value);
                const tenor = parseInt(document.getElementById(`multi-tenor-${i}`).value);
                const keperluan = document.getElementById(`multi-keperluan-${i}`).value.trim();
                const sisa = parseFloat(document.getElementById(`multi-sisa-${i}`).value) || 0;

                if (jumlah && tenor) {
                    submittedLoans.push({
                        index: i,
                        pinjamanKe: `Pinjaman Ke ${i}`,
                        jumlahPinjaman: jumlah,
                        tenor: tenor,
                        keperluan: keperluan || '-',
                        sisaPinjaman: sisa
                    });
                    totalSisaAcc += sisa > 0 ? sisa : jumlah;
                }
            }

            if (submittedLoans.length === 0) {
                showNotification('Harap isi sekurang-kurangnya satu baris pinjaman!', 'error');
                return;
            }

            if (totalSisaAcc >= 30000000 && !jaminanFile) {
                showNotification('Total Sisa Pinjaman Anda mencapai Rp ' + totalSisaAcc.toLocaleString('id-ID') + ' (>= Rp 30.000.000). Anda WAJIB mengunggah berkas Jaminan / Agunan!', 'error');
                return;
            }

            const readerBlangko = new FileReader();
            readerBlangko.onload = function(ev1) {
                const blangkoBase64 = ev1.target.result;
                if (jaminanFile) {
                    const readerJaminan = new FileReader();
                    readerJaminan.onload = function(ev2) {
                        saveAllLoanRecords(nip, submittedLoans, blangkoBase64, ev2.target.result);
                    };
                    readerJaminan.readAsDataURL(jaminanFile);
                } else {
                    saveAllLoanRecords(nip, submittedLoans, blangkoBase64, null);
                }
            };
            readerBlangko.readAsDataURL(blangkoFile);
        }

        function saveAllLoanRecords(nip, loanList, blangkoBase64, jaminanBase64) {
            let loans = getLoans();

            loanList.forEach(item => {
                const totalBunga = item.jumlahPinjaman * (0.10 * (item.tenor / 12));
                const totalPengembalian = item.jumlahPinjaman + totalBunga;
                const cicilanPerBulan = Math.round(totalPengembalian / item.tenor);

                const existingIdx = loans.findIndex(l => l.nip === nip && l.pinjamanKe === item.pinjamanKe);
                const existingLoan = existingIdx !== -1 ? loans[existingIdx] : null;

                let targetStatus = 'Pending';
                let targetTglDisetujui = '-';
                if (existingLoan && existingLoan.status === 'Diterima') {
                    targetStatus = 'Diterima';
                    targetTglDisetujui = existingLoan.tglDisetujui || '-';
                }

                const newLoan = {
                    id: existingLoan ? existingLoan.id : 'LOAN-' + Date.now() + '-' + item.index,
                    nip: nip,
                    pinjamanKe: item.pinjamanKe,
                    jumlahPinjaman: item.jumlahPinjaman,
                    sisaPinjaman: item.sisaPinjaman !== undefined ? item.sisaPinjaman : totalPengembalian,
                    tenor: item.tenor,
                    cicilanPerBulan: cicilanPerBulan,
                    totalPengembalian: totalPengembalian,
                    keperluan: item.keperluan,
                    blangkoFile: blangkoBase64 || (existingLoan ? existingLoan.blangkoFile : ''),
                    jaminanFile: jaminanBase64 || (existingLoan ? existingLoan.jaminanFile : null),
                    status: targetStatus,
                    tglDisetujui: targetTglDisetujui,
                    alasanDisetujui: existingLoan ? (existingLoan.alasanDisetujui || '') : '',
                    alasanDitolak: existingLoan ? (existingLoan.alasanDitolak || '') : '',
                    createdAt: existingLoan ? existingLoan.createdAt : new Date().toISOString()
                };

                if (existingIdx !== -1) {
                    loans[existingIdx] = newLoan;
                } else {
                    loans.push(newLoan);
                }

                syncToGoogleSheets({
                    action: "saveLoan",
                    ...newLoan
                });
            });

            saveLoans(loans);
            showNotification('Pengajuan pinjaman berhasil dikirim dan disinkronkan ke Google Sheets!', 'success', () => { userActiveTab = 'loan-history'; render(); });
        }

        function handleAdminUpdateSavings(e, nip) {
            e.preventDefault();
            const pokok = parseFloat(document.getElementById('admin-sav-pokok').value) || 0;
            const wajib = parseFloat(document.getElementById('admin-sav-wajib').value) || 0;
            const sukarela = parseFloat(document.getElementById('admin-sav-sukarela').value) || 0;

            let allSavings = getSavings().filter(s => s.nip !== nip);

            const newRecords = [
                { id: 'SAV-P-' + Date.now(), nip: nip, jenis: 'Pokok', jumlah: pokok, status: 'Disetujui', createdAt: new Date().toISOString() },
                { id: 'SAV-W-' + Date.now(), nip: nip, jenis: 'Wajib', jumlah: wajib, status: 'Disetujui', createdAt: new Date().toISOString() },
                { id: 'SAV-S-' + Date.now(), nip: nip, jenis: 'Sukarela', jumlah: sukarela, status: 'Disetujui', createdAt: new Date().toISOString() }
            ];

            allSavings.push(...newRecords);
            saveSavings(allSavings);

            newRecords.forEach(savItem => {
                syncToGoogleSheets({
                    action: "saveSavings",
                    ...savItem
                });
            });

            const modal = document.getElementById('savings-modal');
            if (modal) modal.remove();

            showNotification('Data simpanan anggota berhasil diperbarui dan dikirim ke Google Sheets!', 'success', render);
        }

        function recalculateAngsuranModal() {
            const jml = parseFloat(document.getElementById('admin-approved-jumlah').value) || 0;
            const tnr = parseInt(document.getElementById('admin-approved-tenor').value) || 12;
            const autoAngsuran = Math.round((jml / tnr) + (jml * 0.10 / 12));
            const previewEl = document.getElementById('preview-angsuran-modal');
            if (previewEl) {
                previewEl.innerText = `Rp ${autoAngsuran.toLocaleString('id-ID')} / bulan`;
            }
        }

        function handleConfirmApproveLoan(e, loanId) {
            e.preventDefault();
            const approvedTgl = document.getElementById('admin-approved-tgl').value;
            const approvedJumlah = parseFloat(document.getElementById('admin-approved-jumlah').value) || 0;
            const approvedSisa = parseFloat(document.getElementById('admin-approved-sisa').value) || 0;
            const approvedTenor = parseInt(document.getElementById('admin-approved-tenor').value) || 12;
            const alasan = document.getElementById('admin-alasan-disetujui').value.trim();

            const loans = getLoans();
            const loan = loans.find(l => l.id === loanId);

            if (loan) {
                const cicilanPerBulan = Math.round((approvedJumlah / approvedTenor) + (approvedJumlah * 0.10 / 12));
                const totalPengembalian = cicilanPerBulan * approvedTenor;

                loan.status = 'Diterima';
                loan.tglDisetujui = approvedTgl;
                loan.jumlahPinjaman = approvedJumlah;
                loan.sisaPinjaman = approvedSisa;
                loan.tenor = approvedTenor;
                loan.totalPengembalian = totalPengembalian;
                loan.cicilanPerBulan = cicilanPerBulan;
                loan.alasanDisetujui = alasan;
                loan.alasanDitolak = '';

                saveLoans(loans);

                syncToGoogleSheets({
                    action: "saveLoan",
                    ...loan
                });

                const modal = document.getElementById('approve-loan-modal');
                if (modal) modal.remove();

                showNotification(`Permohonan pinjaman ${loanId} berhasil disetujui! Laporan PDF akan otomatis terunduh.`, 'success', () => {
                    render();
                    setTimeout(() => {
                        downloadStatusReportPDF(loan.nip);
                    }, 500);
                });
            }
        }

        function handleConfirmRejectLoan(e, loanId) {
            e.preventDefault();

            const loans = getLoans();
            const loan = loans.find(l => l.id === loanId);

            if (loan) {
                loan.alasanDitolak = alasan;
                loan.alasanDisetujui = '';
                loan.status = 'Ditolak';

                saveLoans(loans);

                syncToGoogleSheets({
                    action: "saveLoan",
                    ...loan
                });

                const modal = document.getElementById('reject-loan-modal');
                if (modal) modal.remove();

                showNotification(`Permohonan pinjaman ${loanId} telah ditolak.`, 'success', render);
            }
        }

        function openPaymentHistoryModal(loanId) {
            const loans = getLoans();
            const loan = loans.find(l => l.id === loanId);
            if (!loan) return;

            const payments = getPayments().filter(p => p.loanId === loanId);

            const tenor = parseInt(loan.tenor) || 12;
            const jumlahPinjaman = parseFloat(loan.jumlahPinjaman) || 0;
            const pokokBln = jumlahPinjaman / tenor;
            const bungaBln = (jumlahPinjaman * 0.10) / 12;
            const totalSetorSeharusnya = Math.round(pokokBln + bungaBln);
            let startDate = new Date(loan.tglDisetujui !== '-' ? loan.tglDisetujui : loan.createdAt);

            const modal = document.createElement('div');
            modal.id = 'payment-history-modal';
            modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn';

            modal.innerHTML = `
                <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl max-w-3xl w-full p-6 border border-white/40 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                        <h3 class="font-extrabold text-slate-800 text-base flex items-center gap-2">
                            <i class="fa-solid fa-receipt text-emerald-600"></i>
                            <span>Kelola Rincian & Nominal Setoran (${tenor} Bulan)</span>
                        </h3>
                        <button onclick="document.getElementById('payment-history-modal').remove()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <div class="bg-indigo-50 p-3 rounded-2xl border border-indigo-100 text-xs grid grid-cols-2 gap-2">
                        <div><strong>ID Pinjaman:</strong> ${loan.id} (${loan.pinjamanKe})</div>
                        <div><strong>NIP Anggota:</strong> ${loan.nip}</div>
                        <div><strong>Pinjaman Pokok:</strong> Rp ${jumlahPinjaman.toLocaleString('id-ID')}</div>
                        <div><strong>Standar Angsuran / Bulan:</strong> <span class="font-bold text-indigo-700">Rp ${totalSetorSeharusnya.toLocaleString('id-ID')}</span></div>
                    </div>

                    <div class="space-y-2">
                        <span class="font-bold text-xs text-slate-800 block">Edit Setoran & Status Angsuran:</span>
                        <div class="max-h-72 overflow-y-auto border border-slate-200 rounded-2xl">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-100 text-slate-600 text-[10px] uppercase sticky top-0 shadow-sm">
                                    <tr>
                                        <th class="p-2">Angsuran</th>
                                        <th class="p-2">Jatuh Tempo</th>
                                        <th class="p-2">Setoran (Rp)</th>
                                        <th class="p-2">Kurang Setor</th>
                                        <th class="p-2">Sisa Pinjaman</th>
                                        <th class="p-2 text-center">Aksi / Simpan</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-[11px]">
                                    ${(() => {
                                        let currentSisaPinjamanRunning = jumlahPinjaman;
                                        let rows = [];

                                        for (let m = 1; m <= tenor; m++) {
                                            let dueDate = new Date(startDate);
                                            dueDate.setMonth(dueDate.getMonth() + m);

                                            const pRecord = payments.find(p => p.angsuranKe === m);
                                            const isPaid = pRecord && pRecord.status === 'Lunas';
                                            const nominalVal = pRecord ? pRecord.nominalSetoran : totalSetorSeharusnya;

                                            const autoKurang = isPaid ? Math.max(0, totalSetorSeharusnya - nominalVal) : 0;
                                            const kurangSetorVal = pRecord && pRecord.kurangSetor !== undefined ? parseFloat(pRecord.kurangSetor) : autoKurang;
                                            
                                            if (isPaid) {
                                                currentSisaPinjamanRunning = currentSisaPinjamanRunning - pokokBln + kurangSetorVal;
                                            }

                                            rows.push(`
                                                <tr class="${isPaid ? (kurangSetorVal > 0 ? 'bg-amber-50/60' : 'bg-emerald-50/40') : 'bg-rose-50/20'}">
                                                    <td class="p-2 font-bold text-indigo-600">Ke-${m}</td>
                                                    <td class="p-2 font-mono">${dueDate.toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' })}</td>
                                                    <td class="p-2">
                                                        <input type="number" id="input-setor-${m}" value="${nominalVal}" step="1000" min="0" class="w-28 px-2 py-1 bg-white border border-slate-300 rounded-lg text-xs font-bold text-indigo-700 focus:outline-none focus:border-indigo-500">
                                                    </td>
                                                    <td class="p-2">
                                                        <input type="number" id="input-kurang-${m}" value="${kurangSetorVal}" step="1000" min="0" placeholder="0" class="w-24 px-2 py-1 bg-white border border-rose-200 rounded-lg text-xs font-bold text-rose-600 focus:outline-none focus:border-rose-500">
                                                    </td>
                                                    <td class="p-2 font-bold text-amber-600">Rp ${Math.round(currentSisaPinjamanRunning).toLocaleString('id-ID')}</td>
                                                    <td class="p-2 text-center flex items-center justify-center gap-1">
                                                        <button onclick="saveAndTogglePayment('${loan.id}', ${m}, ${totalSetorSeharusnya})" class="px-2.5 py-1 rounded-lg text-[10px] font-bold transition ${isPaid ? 'bg-emerald-600 text-white shadow-sm hover:bg-emerald-700' : 'bg-indigo-600 text-white hover:bg-indigo-700'}">

                                                        ${isPaid ? `<button onclick="cancelPaymentStatus('${loan.id}', ${m})" class="px-2 py-1 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg text-[10px] font-bold hover:bg-rose-100" title="Batalkan Pelunasan"><i class="fa-solid fa-rotate-left"></i></button>` : ''}
                                                    </td>
                                                </tr>
                                            `);
                                        }
                                        return rows.join('');
                                    })()}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function saveAndTogglePayment(loanId, angsuranKe, totalSetorSeharusnya) {
            const inputEl = document.getElementById(`input-setor-${angsuranKe}`);
            const inputKurangEl = document.getElementById(`input-kurang-${angsuranKe}`);
            
            const nominalSetor = parseFloat(inputEl.value) || 0;
            const kurangSetorVal = inputKurangEl ? (parseFloat(inputKurangEl.value) || 0) : 0;

            let payments = getPayments();
            const existingIdx = payments.findIndex(p => p.loanId === loanId && p.angsuranKe === angsuranKe);

            const loans = getLoans();
            const loan = loans.find(l => l.id === loanId);

            const newPayment = {
                id: existingIdx !== -1 ? payments[existingIdx].id : 'PAY-' + Date.now() + '-' + angsuranKe,
                loanId: loanId,
                nip: loan ? loan.nip : '',
                angsuranKe: angsuranKe,
                tglBayar: new Date().toLocaleDateString('id-ID'),
                nominalSetoran: nominalSetor,
                kurangSetor: kurangSetorVal,
                status: 'Lunas',
                createdAt: new Date().toISOString()
            };

            if (existingIdx !== -1) {
                payments[existingIdx] = newPayment;
            } else {
                payments.push(newPayment);
            }

            savePayments(payments);

            if (loan) {
                const tenor = parseInt(loan.tenor) || 12;
                const jumlahPinjaman = parseFloat(loan.jumlahPinjaman) || 0;
                const pokokBln = jumlahPinjaman / tenor;

                let calculatedSisa = jumlahPinjaman;
                for (let m = 1; m <= tenor; m++) {
                    const pRec = payments.find(p => p.loanId === loanId && p.angsuranKe === m && p.status === 'Lunas');
                    if (pRec) {
                        const kVal = pRec.kurangSetor !== undefined ? parseFloat(pRec.kurangSetor) : 0;
                        calculatedSisa = calculatedSisa - pokokBln + kVal;
                    }
                }
                
                loan.sisaPinjaman = Math.max(0, calculatedSisa);

                saveLoans(loans);
                syncToGoogleSheets({
                    action: "saveLoan",
                    ...loan
                });
            }

            const modal = document.getElementById('payment-history-modal');
            if (modal) modal.remove();

            openPaymentHistoryModal(loanId);
            render();
        }

        function cancelPaymentStatus(loanId, angsuranKe) {
            let payments = getPayments();
            const existingIdx = payments.findIndex(p => p.loanId === loanId && p.angsuranKe === angsuranKe);

            if (existingIdx !== -1) {
                payments.splice(existingIdx, 1);
                savePayments(payments);

                const loans = getLoans();
                const loan = loans.find(l => l.id === loanId);
                if (loan) {
                    const tenor = parseInt(loan.tenor) || 12;
                    const jumlahPinjaman = parseFloat(loan.jumlahPinjaman) || 0;
                    const pokokBln = jumlahPinjaman / tenor;

                    let calculatedSisa = jumlahPinjaman;
                    for (let m = 1; m <= tenor; m++) {
                        const pRec = payments.find(p => p.loanId === loanId && p.angsuranKe === m && p.status === 'Lunas');
                        if (pRec) {
                            const kVal = pRec.kurangSetor !== undefined ? parseFloat(pRec.kurangSetor) : 0;
                            calculatedSisa = calculatedSisa - pokokBln + kVal;
                        }
                    }

                    loan.sisaPinjaman = Math.max(0, calculatedSisa);

                    saveLoans(loans);
                    syncToGoogleSheets({
                        action: "saveLoan",
                        ...loan
                    });
                }

                const modal = document.getElementById('payment-history-modal');
                if (modal) modal.remove();

                openPaymentHistoryModal(loanId);
                render();
            }
        }

                                        <td class="p-3 font-semibold text-emerald-600">${u.telp || '-'}</td>
                                        <td class="p-3">
                                            <span class="px-2.5 py-1 rounded-full font-bold text-[10px] ${u.isApproved ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                                ${u.isApproved ? 'Disetujui' : 'Pending'}
                                            </span>
                                        </td>
                                        <td class="p-3 text-center space-x-1">
                                            ${!u.isApproved ? `
                                                <button onclick="approveUserAccount('${u.nip}')" class="px-2.5 py-1 bg-emerald-600 text-white rounded-lg font-bold text-[11px] hover:bg-emerald-700"><i class="fa-solid fa-user-check"></i> Setujui</button>
                                            ` : ''}
                                            ${u.nip !== 'admin' ? `
                                                <button onclick="deleteUserAccount('${u.nip}')" class="px-2 py-1 bg-rose-50 text-rose-600 rounded-lg font-bold text-[11px] hover:bg-rose-100"><i class="fa-solid fa-trash"></i></button>
                                            ` : ''}
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function approveUserAccount(nip) {
            const users = getUsers();
            const user = users.find(u => u.nip === nip);
            if (user) {
                user.isApproved = true;
                saveUsers(users);
                showNotification(`Akun ${user.nama} berhasil disetujui!`, 'success', render);
            }
        }

        function deleteUserAccount(nip) {
            if (confirm('Apakah Anda yakin ingin menghapus akun anggota ini?')) {
                let users = getUsers().filter(u => u.nip !== nip);
                saveUsers(users);
                showNotification('Akun anggota berhasil dihapus.', 'success', render);
            }
        }

        render();
    </script>
</body>
</html>
